name: CI

# GitHub-hosted, so pull requests are safe to run: none of this touches a
# GPU or the owner's machine. The suite is deliberately CUDA-free — the
# rules it checks (who may do what, how the queue books jobs) are the
# ones that break silently.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is what WSL2's Ubuntu ships; 3.12 is what a fresh Linux
        # host installs. The node has to run on both.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest
