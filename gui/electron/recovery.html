<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Silicon Node</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", sans-serif;
      color: #e8ebf2;
      background: #111318;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
    }
    main {
      width: min(100%, 540px);
      padding: 36px;
      border: 1px solid #2a2f3a;
      border-radius: 18px;
      background: #191c23;
      box-shadow: 0 24px 80px #0005;
    }
    .brand { color: #39d98a; font-size: 13px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 10px; font-size: 27px; font-weight: 650; }
    p { color: #aab1c0; font-size: 15px; line-height: 1.55; }
    #status { min-height: 24px; margin: 20px 0; color: #d9deea; }
    #error { color: #ff817b; }
    details { margin-top: 8px; color: #aab1c0; font-size: 12px; }
    summary { width: fit-content; cursor: pointer; }
    pre {
      max-height: 150px;
      overflow: auto;
      padding: 12px;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: #aab1c0;
      background: #111318;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    button {
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #3a414e;
      border-radius: 9px;
      color: #e8ebf2;
      background: #242934;
      font: inherit;
      cursor: pointer;
    }
    button.primary { border-color: #39d98a; color: #08130c;
      background: #39d98a; font-weight: 650; }
    button:hover:not(:disabled) { filter: brightness(1.1); }
    button:focus-visible { outline: 2px solid #e8ebf2; outline-offset: 2px; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { margin: 24px 0 0; font-size: 12px; color: #828b9d; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Silicon Node</div>
    <h1 id="title">Connecting to your node…</h1>
    <p id="description">Checking whether the local service is available.</p>
    <p id="status" role="status" aria-live="polite">Please wait.</p>
    <div id="error-block" hidden>
      <p id="error" role="alert"></p>
      <details id="technical-details" hidden>
        <summary>Show technical details</summary>
        <pre id="detail"></pre>
      </details>
    </div>
    <div class="actions">
      <button class="primary" id="start" type="button" hidden>Start Services</button>
      <button id="retry" type="button" hidden>Try Again</button>
    </div>
    <p class="hint">Starting the service can take a little while while WSL boots.</p>
  </main>
  <script>
    const title = document.getElementById("title");
    const description = document.getElementById("description");
    const status = document.getElementById("status");
    const errorBlock = document.getElementById("error-block");
    const error = document.getElementById("error");
    const technicalDetails = document.getElementById("technical-details");
    const detail = document.getElementById("detail");
    const startButton = document.getElementById("start");
    const retryButton = document.getElementById("retry");
    let busy = false;

    function showUnavailable(message, diagnostic = "") {
      busy = false;
      title.textContent = "Silicon Node isn’t running";
      description.textContent = "The dashboard needs the SiliconNode WSL service. Start it here, or try again if you have just started it.";
      status.textContent = "The service is currently unreachable.";
      error.textContent = message || "";
      detail.textContent = diagnostic || "";
      technicalDetails.hidden = !diagnostic;
      technicalDetails.open = false;
      errorBlock.hidden = !message;
      startButton.hidden = false;
      retryButton.hidden = false;
      startButton.disabled = false;
      retryButton.disabled = false;
    }

    function setBusy(message) {
      busy = true;
      const checking = message.startsWith("Checking");
      title.textContent = checking ? "Connecting to your node…" : "Starting Silicon Node…";
      description.textContent = checking
        ? "Checking whether the local service is available."
        : "Windows is starting WSL and asking systemd to start the node service.";
      status.textContent = message;
      errorBlock.hidden = true;
      startButton.hidden = false;
      retryButton.hidden = false;
      startButton.disabled = true;
      retryButton.disabled = true;
    }

    async function openIfReady() {
      const ready = await window.siliconNodeRecovery.check();
      if (!ready) return false;
      title.textContent = "Node connected";
      status.textContent = "Opening the dashboard…";
      await window.siliconNodeRecovery.openDashboard();
      return true;
    }

    async function tryConnection() {
      if (busy) return;
      setBusy("Checking the service…");
      try {
        if (await openIfReady()) return;
        showUnavailable("");
      } catch (err) {
        showUnavailable(String(err));
      }
    }

    async function waitForService() {
      for (let attempt = 0; attempt < 90; attempt++) {
        if (await openIfReady()) return true;
        status.textContent = "Waiting for the service to respond…";
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      showUnavailable("The service start command finished, but the dashboard did not respond within 90 seconds. Try again or check the SiliconNode WSL service.");
      return false;
    }

    startButton.addEventListener("click", async () => {
      if (busy) return;
      setBusy("Starting the SiliconNode WSL distro and service…");
      try {
        const result = await window.siliconNodeRecovery.startServices();
        if (!result.ok) {
          showUnavailable(result.message, result.detail);
          return;
        }
        status.textContent = "Service started. Waiting for the dashboard…";
        await waitForService();
      } catch (err) {
        showUnavailable(String(err));
      }
    });

    retryButton.addEventListener("click", tryConnection);
    tryConnection();
  </script>
</body>
</html>
